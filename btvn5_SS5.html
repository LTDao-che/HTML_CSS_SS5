<!DOCTYPE html>
<html lang="vi">    
<head>
    <title>BTVN5</title>
    <link rel="stylesheet" href="btvn5_SS5.css">
</head>
<body>
    <div>
    <h2>Ý Kiến Phản Hồi tới Nha Sỹ</h2>
    <table cellpadding="8" cellspacing="0" align="center">
<tbody>
    <tr>
        <td><b>Họ và tên:</b></td>
    </tr>    
    <tr>   
        <td>
            <input type="text" name="name" maxlength="50"  placeholder="Nhập họ và tên">
        </td>
    </tr>
    <tr>
        <td><b>Email:</b></td>
    </tr>
    <tr>
        <td>
            <input type="email" name="email" required placeholder="Nhập email của bạn">
        </td>
    </tr>
    <tr>
        <td><b>Phản hồi của bạn:</b></td>
    </tr>
    <tr>
        <td>
            <textarea name="feedback" rows="6" cols="25" required placeholder="Nhập ý kiến của bạn..."></textarea>
        </td>
    </tr>
    <tr>
        <td>
            <input type="submit" value="Gửi ý kiến">
    </td>
    </tr>
    </tbody>
    </table>
    </div>
</body>
</html>
